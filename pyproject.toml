[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-memory-kernel"
version = "0.1.0"
description = "Bounded reference kernel for scoped persistent AI memory and memory-tool execution."
requires-python = ">=3.10"
authors = [{name = "Christopher Campbell"}]
license = {text = "Apache-2.0"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
